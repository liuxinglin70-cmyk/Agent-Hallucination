[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hallucination"
version = "0.1.0"
description = "Outcome-oriented hallucination detector and controlled self-evolution framework"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hallucination-detector = "detector.cli:main"
hallucination-evolution = "evolution.cli:main"

[tool.setuptools.packages.find]
include = ["detector", "evolution"]

[tool.setuptools.package-data]
detector = ["configs/*.json"]
evolution = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["detector/tests", "evolution/tests", "tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
junit_family = "xunit2"
