[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sehd-rise2"
version = "0.2.0"
description = "SEHD-RISE v2: minimal standalone hallucination detector + evolution interfaces"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sehd2-detect = "sehd_rise2.detector.cli:main"

[tool.setuptools.packages.find]
include = ["sehd_rise2*"]

[tool.setuptools.package-data]
"sehd_rise2.detector" = ["configs/*.json"]
